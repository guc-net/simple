name: Update plugin version

on:
  repository_dispatch:
    types: [plugin-update]

jobs:
  update:
    # RUNNER Z KLASTRA (29.08.2026). Organizacji skonczyly sie 28.08.2026
    # o 17:29 minuty na maszynach GitHuba i to zadanie przestalo startowac
    # w ogole ("recent account payments have failed"). Przelacznik awaryjny
    # jest ZMIENNA REPOZYTORIUM (Settings -> Variables), a nie linia w tym
    # pliku: gdy padnie klaster, runnerow nie ma, a zmiana pliku wymagalaby
    # przebiegu, ktorego nie ma jak uruchomic. Wzorzec: guc-net/cluster.
    runs-on: ${{ vars.RUNNER_KONTROLI || 'guc-net-ci-arc' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update version in marketplace.json
        run: |
          PLUGIN="${{ github.event.client_payload.plugin }}"
          VERSION="${{ github.event.client_payload.version }}"

          echo "Updating $PLUGIN to $VERSION"

          python3 -c "
          import json
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          for p in data['plugins']:
              if p['name'] == '$PLUGIN':
                  p['version'] = '$VERSION'
                  p['source']['ref'] = 'v$VERSION'
                  break
          with open('.claude-plugin/marketplace.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update ${{ github.event.client_payload.plugin }} to v${{ github.event.client_payload.version }}"
          git push
